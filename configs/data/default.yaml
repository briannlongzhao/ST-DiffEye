defaults:
  - train_datasets: [cocosearch18_edf_tp, cocosearch18_edf_ta]
  - test_datasets: [cocosearch18_edf_tp]

max_len_traj: 750  # trajectory length (points at 240 Hz) generated by the model
max_len_scan: 16  # maximum number of fixations per scanpath
max_samples: -1  # set to a positive number to load only the first N samples of each dataset

batch_size_train: 128
num_workers: 8

collator:
  _target_: src.data.components.collator.Collator
  max_len_traj: ${data.max_len_traj}
  max_len_scan: ${data.max_len_scan}
