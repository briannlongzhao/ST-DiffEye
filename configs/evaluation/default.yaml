_target_: src.evaluator.Evaluator
eval_root_path: ${paths.output_dir}
seed: ${seed}
# preds: generate trajectories/scanpaths, metrics: compute metrics, qualitatives: draw scanpaths on images
data_to_extract: [preds, metrics]
metrics_to_compute:
